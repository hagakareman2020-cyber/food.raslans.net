# يمنع Supabase المجاني من إيقاف المشروع بعد 7 أيام بدون نشاط.
# يبعت استعلاماً خفيفاً لقاعدة البيانات يومياً فيُحسب كنشاط.
name: Supabase Keepalive

on:
  schedule:
    # يومياً الساعة 6:00 صباحاً بتوقيت UTC (9:00 صباحاً بتوقيت مصر)
    - cron: "0 6 * * *"
  workflow_dispatch: # يسمح بالتشغيل اليدوي من تبويب Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: استعلام خفيف على Supabase
        run: |
          CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1")

          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "فشل الاتصال بـ Supabase:"
            cat /tmp/out.txt
            exit 1
          fi
          echo "✅ المشروع نشط — تم تسجيل النشاط بنجاح"
